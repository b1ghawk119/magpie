name: Track upstream releases
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/fork-sync.yml', 'fork/discover.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: upstream-discovery
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python fork/discover.py
        env:
          GH_TOKEN: ${{ github.token }}
  refresh:
    runs-on: ubuntu-latest
    concurrency: fork-update-feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: python fork/feed.py
        env:
          GH_TOKEN: ${{ github.token }}
